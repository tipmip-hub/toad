# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
#
# We aim to test the following instances to ensure compatibility with various user environments:
# - Python 3.10 and 3.12
# - Ubuntu, Windows, and macOS

# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: PR Checks

on:
  pull_request:
    branches: ["main"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov deptry
          pip install -e .
        shell: bash

      - name: Run Dependency Check
        run: |
          deptry .
        shell: bash

      - name: Run Tests
        run: |
          pytest --cov=toad
        shell: bash

  tutorials:
    # Run every tutorial notebook from top to bottom, so that a change which
    # breaks one is caught before it is merged.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbconvert ipykernel
          pip install -e .
        shell: bash

      - name: Run Tutorials
        env:
          MPLBACKEND: Agg
        run: |
          cd tutorials
          for nb in *.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.kernel_name=python3 \
              --ExecutePreprocessor.timeout=1200 \
              --output-dir "$RUNNER_TEMP/tutorials" "$nb"
            echo "::endgroup::"
          done
        shell: bash
